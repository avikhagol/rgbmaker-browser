<!--
  Included by marimo in the exported app (App(html_head_file="head.html"), run mode only).
  When RGBMaker is embedded in an iframe (e.g. the RAD@home India /rgbmaker/ page),
  report the app's content height to the parent page so it can size the iframe to fit:
    parent.postMessage({type: "iframe-height", height: <px>}, "*")
  The parent may also ask for a fresh value with {type: "iframe-height-request"}.
  Only a height number is sent, so "*" as target origin leaks nothing; the parent
  checks the message origin on its side.
-->
<script>
// After a new GitHub Pages deploy the asset file names change. A browser (or
// the Pages CDN, which caches index.html for ~10 min) can still hold the old
// index.html, whose lazily loaded chunks no longer exist, and marimo then shows
// "Failed to fetch dynamically imported module". Reload once to pick up the
// new build instead of showing the error.
(function () {
  var KEY = "rgbmaker-chunk-reload";
  function reloadOnce(event) {
    try {
      var last = Number(sessionStorage.getItem(KEY) || 0);
      if (Date.now() - last < 30000) return; // already tried recently: let the error show
      sessionStorage.setItem(KEY, String(Date.now()));
    } catch (_) { return; }
    if (event && event.preventDefault) event.preventDefault();
    var url = new URL(window.location.href);
    url.searchParams.set("v", Date.now().toString(36)); // bypass cached index.html
    window.location.replace(url.toString());
  }
  window.addEventListener("vite:preloadError", reloadOnce);
  window.addEventListener("unhandledrejection", function (event) {
    var msg = String((event.reason && event.reason.message) || event.reason || "");
    if (/dynamically imported module|Importing a module script failed|error loading dynamically imported module/i.test(msg)) reloadOnce(event);
  });
})();
</script>
<script>
(function () {
  if (window.parent === window) return; // not embedded

  var last = 0, queued = false, appEl = null;
  var resizeObs = "ResizeObserver" in window ? new ResizeObserver(schedule) : null;

  // marimo fills the viewport and scrolls inside #App, so the document height
  // always equals the iframe height. Measure #App's children instead.
  function contentHeight() {
    var app = document.getElementById("App");
    if (!app) return Math.ceil(document.documentElement.scrollHeight);
    var cs = getComputedStyle(app);
    var h = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    for (var i = 0; i < app.children.length; i++) {
      var el = app.children[i], ecs = getComputedStyle(el);
      if (ecs.position === "fixed" || ecs.position === "absolute") continue;
      h += el.getBoundingClientRect().height + parseFloat(ecs.marginTop) + parseFloat(ecs.marginBottom);
    }
    return Math.ceil(h);
  }

  function post(force) {
    queued = false;
    var h = contentHeight();
    if (!h || (!force && Math.abs(h - last) < 2)) return;
    last = h;
    window.parent.postMessage({ type: "iframe-height", height: h }, "*");
  }

  function schedule() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () { post(false); });
  }

  function watchApp() {
    var app = document.getElementById("App");
    if (!app || app === appEl) return;
    appEl = app;
    if (resizeObs) {
      resizeObs.observe(app);
      for (var i = 0; i < app.children.length; i++) resizeObs.observe(app.children[i]);
    }
    schedule();
  }

  // #App is rendered by React after load, and its children can be replaced.
  new MutationObserver(function (records) {
    watchApp();
    if (resizeObs && appEl) {
      records.forEach(function (r) {
        if (r.target === appEl) r.addedNodes.forEach(function (n) { if (n.nodeType === 1) resizeObs.observe(n); });
      });
    }
    schedule();
  }).observe(document.documentElement, { childList: true, subtree: true });

  window.addEventListener("load", schedule);
  window.addEventListener("resize", schedule);
  window.addEventListener("message", function (event) {
    if (event.source !== window.parent || !event.data) return;
    if (event.data.type === "iframe-height-request") { hideScrollbar(); post(true); }
    if (event.data.type === "theme") setTheme(event.data.theme);
  });

  // The parent asking for our height means it sizes the iframe to fit, so the
  // app's own scroll area (#App) is redundant: hide its scrollbar.
  var noScroll = false;
  function hideScrollbar() {
    if (noScroll) return;
    noScroll = true;
    var style = document.createElement("style");
    style.textContent = "html,body{overflow:hidden!important}" +
      "#App{overflow-y:hidden!important;scrollbar-width:none}" +
      "#App::-webkit-scrollbar{display:none}";
    document.head.appendChild(style);
  }

  // Live theme switch from the parent site ({type: "theme", theme: "light"|"dark"}).
  // The initial theme comes from ?theme= in the iframe URL, which marimo reads.
  // For live changes marimo watches body[data-vscode-theme-kind] (its VS Code
  // integration hook) and re-themes without reloading the app, so use that.
  function setTheme(theme) {
    if (theme !== "light" && theme !== "dark") return;
    var apply = function () { document.body.dataset.vscodeThemeKind = "vscode-" + theme; };
    if (document.body) apply(); else document.addEventListener("DOMContentLoaded", apply);
  }
  if (!resizeObs) setInterval(schedule, 1000);
})();
</script>
